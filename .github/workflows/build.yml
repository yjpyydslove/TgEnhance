name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 恢复签名密钥
        run: |
          # v N2.2：密钥不再随仓库公开（原来 keystore/tgenhance.p12 连同密码
          # 一起提交在仓库里，任何人拿到都能签一个能覆盖升级的假包）。
          # 现在改由 Secret 注入。**没配就明确失败**，而不是悄悄退回 debug
          # 签名 —— 那样会产出一个无法覆盖升级的包，问题要到用户安装时才发现。
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::未配置 KEYSTORE_BASE64 —— 请在仓库 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/tgenhance.p12
          echo "密钥文件 $(wc -c < keystore/tgenhance.p12) 字节"

          # 在这里就把密钥与密码验一遍（v N2.3）。
          #
          # 不验的话，密码不对要到几分钟后的 packageRelease 才暴露，
          # 而且报错是一大段 Java 堆栈，看不出「其实是密码粘贴多了个换行」。
          # 下面只打印长度、不打印内容 —— 长度对不上就是粘贴时带了空格或换行。
          PW="${{ secrets.KEYSTORE_PASSWORD }}"
          echo "KEYSTORE_PASSWORD 长度：${#PW} 字符（应为 24）"
          if keytool -list -keystore keystore/tgenhance.p12 \
               -storepass "$PW" -storetype PKCS12 > /dev/null 2>&1; then
            echo "密钥与密码匹配 ✓"
          else
            echo "::error::密钥与密码不匹配 —— 请核对 KEYSTORE_PASSWORD 的值（${#PW} 字符，应为 24，且首尾无空格换行）"
            exit 1
          fi

      # 注意：不要用 android-actions/setup-android@v3，
      # 其默认安装的 "tools" 包已从 SDK 仓库下线，会直接失败。
      # 这里改用 runner 预装的 cmdline-tools。
      - name: 安装 Android SDK 组件
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "使用 sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$SDK" > local.properties
          echo "Android SDK 就绪: $SDK"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # v N1.16：8.9 -> 8.11.1。AGP 8.9 的最低要求，升 compileSdk 36 时
          # 与 AGP 一起动（少了这一步会直接报版本不匹配）。
          gradle-version: '8.11.1'

      - name: 静态检查
        run: |
          # v N2.5：五项检查进 CI。
          #
          # 这些检查原本只靠「发版前手动记得跑」—— 忘了就漏过去，
          # 等 CI 编译阶段才暴露（import 缺失）或根本暴露不了
          # （注册表不一致、摆设开关这类「编译能过但功能不对」的问题）。
          # 脚本随仓库走（scripts/），有退出码，任何一项不过整个 job 失败。
          set -e
          python3 scripts/check_kotlin_imports.py app/src/main/java
          python3 scripts/check_api.py .
          python3 scripts/check_hook_guard.py app/src/main/java
          python3 scripts/check_selfcheck_coverage.py --root .
          python3 scripts/check_registry_consistency.py --root .

      - name: 编译 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          # 密钥密码必须在这里传给 Gradle（v N2.4）。
          #
          # build.gradle.kts 是 `System.getenv("KEYSTORE_PASSWORD")` 读的，
          # 而 GitHub Actions 的 Secret **不会自动变成环境变量** ——
          # 不显式声明这一行，Gradle 拿到的是 null、回退到占位密码，
          # 于是打包阶段报「keystore password was incorrect」。
          # 之前那几轮失败全是因为漏了这一行：密钥文件、密码长度、
          # keytool 校验全都正常，唯独 Gradle 用的是另一个密码。
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8"

      - name: 整理产物
        run: |
          set -e
          mkdir -p out
          VER="$(grep -E '^VERSION_NAME=' gradle.properties | head -1 | cut -d= -f2 | tr -d '[:space:]')"
          [ -n "$VER" ] || VER="dev"
          APK="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::未找到 Release APK"
            find app/build/outputs -name '*.apk' || true
            exit 1
          fi
          echo "找到 APK: $APK"
          cp "$APK" "out/TgEnhance-${VER}.apk"
          ls -la out/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: TgEnhance-apk
          path: out/*.apk
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
